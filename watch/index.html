<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch a live match | VolleyTally</title>
  <meta name="description" content="Join a live volleyball match a coach is sharing.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Watch this volleyball match live">
  <meta property="og:description" content="A coach is sharing this match live. Open the link to follow along.">
  <meta property="og:image" content="https://volleytallyapp.com/assets/images/volleytally-og.png">
  <meta name="theme-color" content="#0e0d0c">
  <link rel="icon" href="/assets/images/volleytally-icon.png">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    [hidden] { display:none !important; }
    .watch-wrap { width:min(560px,calc(100% - 2*var(--pad))); margin:0 auto; padding:clamp(48px,9vw,110px) 0; text-align:center; }
    .watch-wrap h1 { font-size:clamp(2.6rem,7vw,4.6rem); margin-bottom:14px; }
    .watch-lead { color:var(--muted); font-size:1.08rem; line-height:1.65; margin-bottom:36px; }
    .watch-code { display:inline-flex; gap:.35em; justify-content:center; margin:0 auto 36px; padding:18px 26px; border:1px solid var(--line); border-radius:14px; background:var(--surface); font:700 clamp(2.2rem,8vw,3.4rem) 'DM Mono',monospace; letter-spacing:.18em; }
    .watch-actions { display:flex; flex-direction:column; gap:12px; align-items:stretch; }
    .watch-actions .button { justify-content:center; }
    .watch-alt { margin-top:34px; color:var(--muted); font-size:.95rem; line-height:1.7; }
    .watch-alt strong { color:var(--ink); }
    .nowrap { white-space:nowrap; }
    .watch-missing { color:var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="VolleyTally home"><img src="/assets/images/volleytally-icon.png" alt="" width="44" height="44"><span>VolleyTally</span></a>
  </header>

  <main class="watch-wrap" id="main">
    <p class="section-label">Live match</p>
    <h1>Watch it live.</h1>
    <p class="watch-lead">A coach is sharing this match. Open it in VolleyTally to follow the score as it happens.</p>

    <div id="code-box" class="watch-code" aria-label="Match code" hidden></div>
    <p id="no-code" class="watch-missing" hidden></p>

    <div id="actions" class="watch-actions" hidden></div>
    <p id="alt" class="watch-alt" hidden></p>
    <noscript><p class="watch-alt">Open VolleyTally, tap <strong class="nowrap">Watch a live Match</strong>, and enter the code from the link.</p></noscript>
  </main>

  <script>
  (function () {
    /**
     * Watch page. VolleyTrack shares https://volleytallyapp.com/watch/<CODE>,
     * and the 404 page forwards that path here as ?c=<CODE>.
     *
     * Codes follow the app's rules (isValidJoinCode): trim, uppercase, then
     * exactly 4 or 6 characters from the alphabet below. A 6-character code
     * can only be a VolleyTrack broadcast. A 4-character code may be either
     * app's, as in the app, so the page claims nothing about it.
     *
     * VolleyTrack appears only when /config/volleytrack-promo-v1.json says
     * promote is exactly true for the visitor's platform. If the file is
     * missing, slow, redirected or malformed, only VolleyTally shows.
     */
    var ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    var CODE_PATTERN = new RegExp('^(?:[' + ALPHABET + ']{4}|[' + ALPHABET + ']{6})$');
    var PROMO_PATH = '/config/volleytrack-promo-v1.json';

    var VOLLEYTALLY = {
      name: 'VolleyTally',
      scheme: 'volleytally://spectate/',
      ios: 'https://apps.apple.com/us/app/volleytally/id6743733066',
      android: 'https://play.google.com/store/apps/details?id=com.HarpElle.volleytally'
    };
    var VOLLEYTRACK = {
      name: 'VolleyTrack',
      scheme: 'volleytrack://spectate/',
      ios: 'https://apps.apple.com/app/id6758875792',
      android: 'https://play.google.com/store/apps/details?id=com.harpelleapps.volleytrack'
    };

    function platform() {
      var ua = navigator.userAgent || '';
      if (/Android/i.test(ua)) return 'android';
      if (/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
      return 'other';
    }

    function readCode() {
      var raw = null;
      var m = location.pathname.match(/^\/watch\/([^\/]+)\/?$/);
      if (m) raw = m[1];
      if (!raw) raw = new URLSearchParams(location.search).get('c');
      if (!raw) return { state: 'none' };
      try { raw = decodeURIComponent(raw); } catch (e) { /* keep raw; it fails validation */ }
      var code = raw.trim().toUpperCase();
      return CODE_PATTERN.test(code) ? { state: 'ok', code: code } : { state: 'bad' };
    }

    function link(href, label, primary) {
      var a = document.createElement('a');
      a.className = 'button ' + (primary ? 'button-primary' : 'button-quiet');
      a.href = href;
      a.textContent = label;
      if (/^https:/.test(href)) a.rel = 'noopener';
      return a;
    }

    function storeLabel(app, store) {
      return 'Get ' + app.name + (store === 'ios' ? ' on the App Store' : ' on Google Play');
    }

    // The same rules the app applies: schema 1, plain objects, real booleans.
    // Anything else means off.
    function promoOn(text, plat) {
      if (plat !== 'ios' && plat !== 'android') return false;
      if (typeof text !== 'string' || text.length > 8192) return false;
      var data;
      try { data = JSON.parse(text); } catch (e) { return false; }
      function plain(v) { return typeof v === 'object' && v !== null && !Array.isArray(v); }
      if (!plain(data) || data.schema !== 1 || !plain(data.volleytrack)) return false;
      var ios = data.volleytrack.ios, android = data.volleytrack.android;
      if (!plain(ios) || !plain(android)) return false;
      if (typeof ios.promote !== 'boolean' || typeof ios.viewerUpsell !== 'boolean') return false;
      if (typeof android.promote !== 'boolean' || typeof android.viewerUpsell !== 'boolean') return false;
      return (plat === 'ios' ? ios : android).promote === true;
    }

    function fetchPromo(plat, done) {
      if (plat === 'other' || !window.fetch) { done(false); return; }
      var ctl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 4000);
      fetch(PROMO_PATH, { credentials: 'omit', cache: 'no-store', signal: ctl ? ctl.signal : undefined })
        .then(function (r) {
          if (!r.ok || r.redirected || new URL(r.url).pathname !== PROMO_PATH) throw new Error('not the file');
          return r.text();
        })
        .then(function (t) { clearTimeout(timer); done(promoOn(t, plat)); })
        .catch(function () { clearTimeout(timer); done(false); });
    }

    var plat = platform();
    var parsed = readCode();
    var codeBox = document.getElementById('code-box');
    var actions = document.getElementById('actions');
    var alt = document.getElementById('alt');
    var problem = document.getElementById('no-code');

    function addStores(app) {
      if (plat === 'other') {
        actions.appendChild(link(app.ios, storeLabel(app, 'ios'), false));
        actions.appendChild(link(app.android, storeLabel(app, 'android'), false));
      } else {
        actions.appendChild(link(app[plat], storeLabel(app, plat), false));
      }
    }

    if (parsed.state !== 'ok') {
      problem.textContent = parsed.state === 'none'
        ? 'This link is missing its match code. Ask the coach to share it again.'
        : 'That match code does not look right. Ask the coach to share the link again.';
      problem.hidden = false;
      addStores(VOLLEYTALLY);
      actions.hidden = false;
      return;
    }

    var code = parsed.code;
    code.split('').forEach(function (ch) {
      var s = document.createElement('span');
      s.textContent = ch;
      codeBox.appendChild(s);
    });
    codeBox.hidden = false;

    if (plat !== 'other') {
      actions.appendChild(link(VOLLEYTALLY.scheme + code, 'Open in VolleyTally', true));
    }
    addStores(VOLLEYTALLY);
    actions.hidden = false;

    alt.innerHTML = plat === 'other'
      ? 'Open this link on your phone. In VolleyTally, tap <strong class="nowrap">Watch a live Match</strong> and enter code <strong>' + code + '</strong>.'
      : 'Already have VolleyTally? Open it, tap <strong class="nowrap">Watch a live Match</strong>, and enter code <strong>' + code + '</strong>.';
    alt.hidden = false;

    // VolleyTrack joins the list only while promotion is on for this platform.
    fetchPromo(plat, function (on) {
      if (!on) return;
      actions.appendChild(link(VOLLEYTRACK.scheme + code, 'Open in VolleyTrack', false));
      actions.appendChild(link(VOLLEYTRACK[plat], storeLabel(VOLLEYTRACK, plat), false));
    });
  })();
  </script>
</body>
</html>
